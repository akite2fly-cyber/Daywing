<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daywing" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Daywing — Calendar Journal</title>
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="flower-field" id="page-flowers" aria-hidden="true"></div>

    <header class="site-header">
      <p class="brand">Daywing</p>
      <p class="tagline">A quiet place for each day</p>
      <a class="logout-link" href="/logout">Sign out</a>
    </header>

    <main class="layout">
      <section class="calendar-panel" aria-label="Month calendar">
        <div class="month-nav">
          <button type="button" class="nav-btn" id="prev-month" aria-label="Previous month">
            ‹
          </button>
          <h1 class="month-title" id="month-title">Month</h1>
          <button type="button" class="nav-btn" id="next-month" aria-label="Next month">
            ›
          </button>
        </div>

        <div class="weekday-row" aria-hidden="true">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
          <span>Thu</span><span>Fri</span><span>Sat</span>
        </div>

        <div class="day-grid" id="day-grid" role="grid" aria-labelledby="month-title"></div>

        <section class="appointments-panel" aria-label="Month appointments">
          <div class="section-heading">
            <h2 class="appointments-title">Appointments</h2>
            <p class="section-hint">Everything planned this month</p>
          </div>
          <div class="appointments-grid" id="appointments-grid"></div>
        </section>
      </section>
    </main>

    <!-- Day open overlay: butterfly + quote + journal -->
    <div class="day-overlay" id="day-overlay" hidden>
      <div class="overlay-backdrop" id="overlay-backdrop"></div>

      <div class="reveal-stage" id="reveal-stage" aria-live="polite">
        <div class="butterfly-host" id="butterfly-host" aria-hidden="true"></div>
        <p class="butterfly-name" id="butterfly-name"></p>

        <blockquote class="quote" id="day-quote">
          <p class="quote-text"></p>
          <cite class="quote-author"></cite>
        </blockquote>

        <p class="kindness-idea" id="kindness-idea">
          <span class="kindness-label">A kindness idea</span>
          <span class="kindness-text"></span>
        </p>
      </div>

      <article class="journal-sheet" id="journal-sheet" role="dialog" aria-modal="true" aria-labelledby="journal-date">
        <div class="sheet-bg" aria-hidden="true"></div>
        <div class="sheet-flowers" id="sheet-flowers" aria-hidden="true"></div>
        <header class="journal-header">
          <div class="sheet-butterfly-wrap">
            <div class="sheet-butterfly" id="sheet-butterfly" aria-hidden="true"></div>
            <p class="sheet-butterfly-label" id="sheet-butterfly-label"></p>
          </div>
          <div class="journal-heading">
            <p class="journal-kicker">Day</p>
            <h2 class="journal-date" id="journal-date">Date</h2>
          </div>
          <button type="button" class="close-btn" id="close-day" aria-label="Close day">
            ✕
          </button>
        </header>

        <section class="planner" aria-label="Daily planner">
          <div class="section-heading">
            <h3>Planner</h3>
            <p class="section-hint">Add a time and details for each plan</p>
          </div>
          <ul class="task-list" id="task-list"></ul>
          <div class="icon-picker" id="icon-picker" role="listbox" aria-label="Plan type"></div>
          <form class="task-form" id="task-form">
            <label class="sr-only" for="task-input">Add a plan</label>
            <input
              type="text"
              id="task-input"
              class="task-input"
              placeholder="Add something to plan…"
              maxlength="240"
              autocomplete="off"
            />
            <label class="sr-only" for="task-time">Time</label>
            <input
              type="time"
              id="task-time"
              class="task-time"
              title="Appointment time"
            />
            <label class="sr-only" for="task-notes">Details</label>
            <textarea
              id="task-notes"
              class="task-notes"
              rows="2"
              maxlength="2000"
              placeholder="Details for this plan…"
            ></textarea>
            <button type="submit" class="task-add-btn">Add</button>
          </form>
        </section>

        <section class="journal-section" aria-label="Journal">
          <div class="section-heading">
            <h3>Journal</h3>
            <p class="section-hint">Thoughts from this day</p>
          </div>
          <label class="sr-only" for="journal-body">Today's entry</label>
          <textarea
            id="journal-body"
            class="journal-body"
            placeholder="Write what this day held…"
            rows="8"
          ></textarea>
        </section>

        <footer class="journal-footer">
          <p class="save-status" id="save-status" aria-live="polite"></p>
          <button type="button" class="save-btn" id="save-entry">Save journal</button>
        </footer>
      </article>
    </div>

    <script src="/static/js/flowers.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
