<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daywing" />
    <title>Daywing — Sign in</title>
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="login-page">
    <div class="sky" aria-hidden="true"></div>
    <div class="flower-field flower-field--login" aria-hidden="true">
      <span class="deco-flower deco-flower--tl" data-flower="daisy"></span>
      <span class="deco-flower deco-flower--br" data-flower="tulip"></span>
      <span class="deco-flower deco-flower--bl" data-flower="blossom"></span>
    </div>

    <main class="login-card">
      <p class="brand">Daywing</p>
      <p class="tagline">Enter your password to continue</p>

      {% if error %}
      <p class="login-error" role="alert">{{ error }}</p>
      {% endif %}

      <form method="post" class="login-form" action="{{ url_for('login_submit', next=request.args.get('next', '')) }}">
        <label class="sr-only" for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="login-input"
          placeholder="Password"
          required
          autofocus
          autocomplete="current-password"
        />
        <button type="submit" class="login-btn">Open journal</button>
      </form>
    </main>
    <script src="/static/js/flowers.js"></script>
  </body>
</html>
